<nav aria-label="Documentation sections">
  <ng-container *ngFor="let item of tabData">
    <p *ngIf="item.type === 'category'">{{ item.title }}</p>
    <a
      *ngIf="item.type === 'entry'"
      [href]="'#' + item.fragment"
      (click)="navLinkClick($event, item.fragment)"
    >{{ item.title }}</a>
  </ng-container>
</nav>
