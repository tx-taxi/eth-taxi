<div *ngIf="showTitle && mode === 'network'" class="main-title">Ethereum Network</div>
<div *ngIf="showTitle && mode === 'rewards'" class="main-title">Recent execution rewards</div>
<div class="card-wrapper">
  <div class="card">
    <div class="widget-toggler" role="group" aria-label="Ethereum network dashboard panel">
      <a href="" (click)="setMode('network')" class="toggler-option"
        [ngClass]="{'inactive': mode === 'network'}" [attr.aria-pressed]="mode === 'network'"><small>network</small></a>
      <span aria-hidden="true"> | </span>
      <a href="" (click)="setMode('rewards')" class="toggler-option"
        [ngClass]="{'inactive': mode === 'rewards'}" [attr.aria-pressed]="mode === 'rewards'"><small>rewards</small></a>
    </div>
    <div *ngIf="mode === 'network'; else rewards" class="card-body more-padding">
      <div class="difficulty-adjustment-container" *ngIf="networkStats$ | async as network; else loadingNetwork">
        <div class="epoch-progress">
          <svg class="epoch-blocks" height="22px" width="100%" viewBox="0 0 224 9" shape-rendering="crispEdges" preserveAspectRatio="none" role="img" aria-label="Latest block gas utilization">
            <defs>
              <linearGradient id="diff-gradient" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="var(--primary)" />
                <stop offset="100%" stop-color="var(--mainnet-alt)" />
              </linearGradient>
            </defs>
            <rect
              *ngFor="let rect of network.shapes"
              [attr.x]="rect.x" [attr.y]="rect.y"
              [attr.width]="rect.w" [attr.height]="rect.h"
              class="rect {{rect.status}}"
            ></rect>
          </svg>
        </div>
        <div class="difficulty-stats">
          <div class="item">
            <div class="card-text">
              ~<app-time [time]="network.observedBlockTime" [fractionDigits]="1"></app-time>
            </div>
            <div class="symbol">Observed block time</div>
          </div>
          <div class="item">
            <div class="card-text bigger">
              {{ network.gasUtilization | number: '1.0-1' }}<span class="symbol">%</span>
            </div>
            <div class="symbol">Block gas used</div>
          </div>
          <div class="item">
            <div class="card-text">#{{ network.latestBlockHeight | number }}</div>
            <div class="symbol">Latest block</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #rewards>
  <div class="card-body more-padding reward-stats-panel">
    <app-reward-stats></app-reward-stats>
  </div>
</ng-template>

<ng-template #loadingNetwork>
  <div class="epoch-progress">
    <div class="skeleton-loader"></div>
  </div>
  <div class="difficulty-skeleton loading-container">
    <div class="item"><div class="card-text"><div class="skeleton-loader"></div><div class="skeleton-loader"></div></div></div>
    <div class="item"><div class="card-text"><div class="skeleton-loader"></div><div class="skeleton-loader"></div></div></div>
    <div class="item"><div class="card-text"><div class="skeleton-loader"></div><div class="skeleton-loader"></div></div></div>
  </div>
</ng-template>
