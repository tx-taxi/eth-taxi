<div #blockTxTitle id="block-tx-title" class="block-tx-title">
  <h2 class="text-start">
    <ng-container *ngTemplateOutlet="txCount === 1 ? transactionsSingular : transactionsPlural; context: {$implicit: txCount | number}"></ng-container>
    <ng-template #transactionsSingular let-i i18n="shared.transaction-count.singular">{{ i }} transaction</ng-template>
    <ng-template #transactionsPlural let-i i18n="shared.transaction-count.plural">{{ i }} transactions</ng-template>
  </h2>
  <ngb-pagination class="pagination-container float-end" [collectionSize]="txCount" [rotate]="true" [pageSize]="itemsPerPage" [(page)]="page" (pageChange)="pageChange(page, blockTxTitle)" [maxSize]="paginationMaxSize" [boundaryLinks]="true" [ellipses]="false"></ngb-pagination>
</div>
<div class="clearfix"></div>

<ng-container *ngIf="transactions$ | async as transactions; else loading">
  <app-transactions-list *ngIf="!transactionsError" [transactions]="transactions" [paginated]="true" [blockTime]="timestamp"></app-transactions-list>
</ng-container>

<div *ngIf="transactionsError" class="block-transactions-unavailable" role="status">
  <strong>Transactions are temporarily unavailable</strong>
  <span>The block summary is current, but its transaction rows could not be loaded.</span>
  <button type="button" (click)="retryTransactions()">
    <fa-icon [icon]="['fas', 'redo-alt']" [fixedWidth]="true"></fa-icon>
    Retry transactions
  </button>
</div>

<ng-template #loading>
  <div class="tx-skeleton">
    <ng-container *ngIf="(txsLoadingStatus$ | async) as txsLoadingStatus; else headerLoader">
      <div class="header-bg box">
        <div class="progress progress-dark" style="margin: 4px; height: 14px;">
          <div class="progress-bar progress-light" role="progressbar" [ngStyle]="{'width': txsLoadingStatus + '%' }"></div>
        </div>
      </div>
    </ng-container>

    <div class="header-bg box">
      <div class="row">
        <div class="col-sm">
          <span class="skeleton-loader"></span>
        </div>
        <div class="col-sm">
          <span class="skeleton-loader"></span>
          <span class="skeleton-loader"></span>
          <span class="skeleton-loader"></span>
        </div>
      </div>
    </div>
  </div>
</ng-template>

<ng-template #headerLoader>
  <div class="header-bg box">
    <span class="skeleton-loader"></span>
  </div>
</ng-template>

<ngb-pagination class="pagination-container float-end" [collectionSize]="txCount" [rotate]="true" [pageSize]="itemsPerPage" [(page)]="page" (pageChange)="pageChange(page, blockTxTitle)" [maxSize]="paginationMaxSize" [boundaryLinks]="true" [ellipses]="false"></ngb-pagination>
