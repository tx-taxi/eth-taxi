<section class="gas-market" [attr.aria-label]="ethereumGasMarketLabel + ' ' + historyLabel.toLowerCase()">
  <div class="gas-market__header">
    <div>
      <h3 class="gas-market__title" i18n="@@eth.graph.gas-market">Gas market</h3>
      <span class="sr-only" i18n="@@eth.graph.historyHeading">Gas market, {{ historyLabel }}</span>
    </div>

    <ul class="gas-market__legend" i18n-aria-label="@@eth.graph.legend" aria-label="Chart legend">
      <li><span class="gas-market__swatch gas-market__swatch--fee" aria-hidden="true"></span><ng-container i18n="@@eth.graph.base-fee">Base fee (gwei)</ng-container></li>
      <li><span class="gas-market__swatch gas-market__swatch--utilization" aria-hidden="true"></span><ng-container i18n="@@eth.graph.utilization">Network utilization (%)</ng-container></li>
    </ul>
  </div>

  <div
    *ngIf="recentSamples.length; else emptyHistory"
    class="gas-market__chart"
    role="img"
    [attr.aria-label]="accessibleSummary"
    echarts
    [initOpts]="chartInitOptions"
    [options]="chartOptions"
    [style.height.px]="height"
  ></div>

  <ng-template #emptyHistory>
    <div class="gas-market__empty" role="status" [style.height.px]="height">
      <span class="gas-market__empty-mark" aria-hidden="true"></span>
      <span>{{ emptyState }}</span>
    </div>
  </ng-template>
</section>
